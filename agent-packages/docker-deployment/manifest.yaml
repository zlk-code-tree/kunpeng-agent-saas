code: docker-deployment
name: Docker 部署助手
category: 运维
version: 1
app_type: chatbot
agent_template_id: 00000000-0000-4000-8000-000000000201
agent_version_id: 00000000-0000-4000-8000-000000000202
description: >-
  基于当前 Gin Dify SaaS 项目的真实 Docker Compose、Dockerfile、环境变量、
  数据迁移和备份脚本回答部署与运维问题。
prompt_file: prompts/system.md
knowledge_directory: knowledge/docker-deployment
suggested_questions:
  - 当前 Docker 环境部署了哪些组件？
  - 如何从零完成生产环境部署？
  - API 容器一直 unhealthy 应该怎么排查？
  - 如何备份和恢复业务数据库与对象存储？
  - 使用平台托管 Dify 时客户侧需要部署什么？
parameters:
  deploymentMode:
    type: string
    enum: [development, production]
    default: production
  appMode:
    type: string
    enum: [single, multi]
    default: single
  managedDify:
    type: boolean
    default: true
