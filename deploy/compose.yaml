services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gin_dify
      POSTGRES_USER: gin_dify
      POSTGRES_PASSWORD: gin_dify
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../server/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gin_dify -d gin_dify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  objectstore:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-s3", "-dir=/data", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: gin-dify
      AWS_SECRET_ACCESS_KEY: gin-dify-secret
      S3_BUCKET: gin-dify
    ports:
      - "18333:8333"
    volumes:
      - objectstore_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  objectstore_data:

