              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/SuccessFlag' } } }
        '400':
          description: 'code=14802 参数校验失败（tenantId 必须是 UUID，allowedAgentVersionIds 元素为 UUID，maxCallsPerRun 1-1000）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlatformAdminOnly' }
        '500':
          description: 'code=15801 授权失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/admin/billing/accounts/{id}/adjustments:
    post:
      tags: [计费]
      summary: 平台管理员对计费账户人工调账
      description: '按金额（正为加款、负为扣款）调整指定账户钱包，负向调账只能扣减未冻结额度（调账后余额不得低于冻结金额，保证运行中的预占可正常结算）。以幂等键记录操作原因和操作者，写入不可变钱包流水作为审计依据。仅安装级平台管理员可访问。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentInput' }
      responses:
        '200':
          description: '调账成功，code=0，data 为调账后的账户余额'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/Account' } } }
        '400':
          description: 'code=14700 参数校验失败（amount 必填，idempotencyKey 8-128，reason 2-255）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlatformAdminOnly' }
        '409':
          description: 'code=14701 金额非法（0 或非数值）、账户不存在/非活跃，或调账后余额低于冻结金额'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15702 调账失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/admin/costs/summary:
    get:
      tags: [计费]
      summary: 按成本类型、供应商和模型汇总上游成本
      description: '使用不可变价格版本记录的供应商成本汇总，区间为 [from, to)（按记录创建时间过滤）。from 缺省为当前时间前一个月，to 缺省为当前时间；传入非 RFC3339 时间时忽略该参数。仅安装级平台管理员可访问。'
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: '起始时间（含），RFC3339 格式，缺省为当前时间前一个月'
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: '结束时间（不含），RFC3339 格式，缺省为当前时间'
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: '查询成功，code=0，data 为成本汇总数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/CostSummaryItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlatformAdminOnly' }
        '500':
          description: 'code=15710 加载成本汇总失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/admin/reconciliation:
    post:
      tags: [计费]
      summary: 执行一次只读账务对账扫描
      description: '扫描运行、用量、预占和成本之间的不一致并持久化对账报告：成功运行缺用量、预占待用量、预占待人工复核、有用量缺成本四类计数。对账只识别异常并生成报告，不猜测缺失用量、不自动移动资金，避免错误数据触发不可逆账务调整。仅安装级平台管理员可访问。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '对账完成，code=0，data 为对账报告'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/ReconciliationReport' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlatformAdminOnly' }
        '500':
          description: 'code=15711 对账失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/admin/tenants/{id}/export:
    post:
      tags: [运维]
      summary: 导出租户迁移清单与校验和（不含凭据）
      description: '在 REPEATABLE READ 只读一致性快照中按白名单导出租户业务数据（租户、成员、智能体配置、知识库、文件、文档、会话、消息、运行、用量、钱包流水），密码哈希、API Key、集成凭据、邀请令牌等秘密一律排除。返回 manifest 及其 SHA-256 校验和，导入/迁移前可校验归档是否被篡改。导出审计写入失败时整个请求失败，不返回未留痕的数据。仅安装级平台管理员可访问。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: '导出成功，code=0，data 为导出结果'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/ExportResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PlatformAdminOnly' }
        '500':
          description: 'code=15900 导出失败（含租户不存在、审计写入失败）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    toolTicket: { type: apiKey, in: header, name: Authorization, description: 'Tool <signed-ticket>' }
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: '资源 ID（UUID）'
      schema: { type: string, format: uuid }
  schemas:
    Envelope:
      type: object
      required: [code, message]
      description: '统一响应封装。成功 code=0、message=ok、data 为业务数据；错误 code 为业务错误码（14xxx 客户端错误、15xxx 服务端错误），无 data'
      properties:
        code: { type: integer }
        message: { type: string }
        data: {}
    StatusMessage:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
    InstallationStatus:
      type: object
      required: [installed, mode]
      properties:
        installed: { type: boolean, description: '是否已完成首次安装' }
        mode: { type: string, enum: [single, multi], description: '部署模式：single 单租户、multi 多租户' }
        installationId: { type: string, format: uuid, description: '安装 ID，未安装时不返回' }
        defaultTenantId: { type: string, format: uuid, description: '默认租户 ID，未安装时不返回' }
    SetupInput:
      type: object
      required: [platformName, tenantName, adminUsername, adminName, adminPassword]
      properties:
        platformName: { type: string, minLength: 2, maxLength: 100, description: '平台名称' }
        tenantName: { type: string, minLength: 2, maxLength: 100, description: '默认租户名称' }
        adminUsername: { type: string, minLength: 3, maxLength: 64, description: '平台管理员登录名' }
        adminName: { type: string, minLength: 2, maxLength: 64, description: '平台管理员显示名' }
        adminPassword: { type: string, minLength: 8, maxLength: 128, description: '平台管理员登录密码（bcrypt 存储）' }
    Capabilities:
      type: object
      required: [installed, appMode, features]
      properties:
        installed: { type: boolean }
        appMode: { type: string, enum: [single, multi] }
        features:
          type: object
          description: '前端功能开关'
          properties:
            tenantCreation: { type: boolean }
            tenantSwitching: { type: boolean }
            billing: { type: boolean }
            payment: { type: boolean }
            enterpriseDify: { type: boolean }
            modelRouting: { type: boolean }
            toolGateway: { type: boolean }
            providerCosting: { type: boolean }
            tenantExport: { type: boolean }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: '登录名' }
        password: { type: string, description: '密码' }
    LoginResult:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string, description: 'JWT 访问令牌，作为 Bearer 凭据调用受保护接口' }
    UserInfo:
      type: object
      required: [userId, username, realName, avatar, roles, desc, homePath, token]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        realName: { type: string, description: '显示名' }
        avatar: { type: string, description: '头像 URL，无头像时为空字符串' }
        roles:
          type: array
          items: { type: string }
          description: '当前租户角色（首位）及可选的 platform_admin 标记'
        desc: { type: string, description: '固定描述文本' }
        homePath: { type: string, description: '前端默认首页路径' }
        token: { type: string, description: '预留字段，当前返回空字符串' }
    RegisterInput:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, description: '登录名，服务端转小写保存' }
        displayName: { type: string, minLength: 2, maxLength: 64, description: '显示名，个人空间名称以其为前缀' }
        password: { type: string, minLength: 8, maxLength: 128 }
    RegisterResult:
      type: object
      required: [accessToken, tenantId]
      properties:
        accessToken: { type: string, description: '注册即签发的 JWT 访问令牌' }
        tenantId: { type: string, format: uuid, description: '自动创建的个人空间租户 ID' }
    TenantItem:
      type: object
      required: [id, name, type, role, status, current, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [personal, organization], description: 'personal 个人空间、organization 企业空间' }
        role: { type: string, enum: [owner, admin, finance, member], description: '当前用户在该租户的角色' }
        status: { type: string, enum: [active] }
        current: { type: boolean, description: '是否为当前令牌所选租户' }
        createdAt: { type: string, format: date-time }
    TenantCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, description: '企业空间名称' }
    SwitchResult:
      type: object
      required: [accessToken, tenantId, role]
      properties:
        accessToken: { type: string, description: '绑定目标租户的新 JWT，后续请求须使用该令牌' }
        tenantId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, finance, member] }
    TenantMember:
      type: object
      required: [userId, username, displayName, role, status, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, finance, member] }
        status: { type: string, enum: [active] }
        joinedAt: { type: string, format: date-time }
    InviteInput:
      type: object
      required: [username, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, description: '被邀请用户的登录名（须已注册），服务端转小写匹配' }
        role: { type: string, enum: [admin, member, finance], description: '授予的角色' }
    Invitation:
      type: object
      required: [id, tenantId, username, role, token, expiresAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [admin, member, finance] }
        token: { type: string, description: '原始邀请令牌，仅此一次返回（数据库只存 SHA-256 摘要），72 小时内有效' }
        expiresAt: { type: string, format: date-time }
    AcceptInvitationInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 256, description: '邀请时返回的原始令牌' }
    TransferOwnershipInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid, description: '新所有者的用户 ID，须为本租户活跃成员' }
    SuccessFlag:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    AgentItem:
      type: object
      required: [id, agentVersionId, name, description, category, version, parameterSchema, enabled, configured]
      properties:
        id: { type: string, format: uuid, description: '智能体模板 ID' }
        agentVersionId: { type: string, format: uuid, description: '最新已发布版本 ID，创建运行时使用' }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        version: { type: integer }
        parameterSchema: { type: object, additionalProperties: true, description: '该版本的参数 JSON Schema' }
        enabled: { type: boolean, description: '租户级启用开关（未配置时默认启用）' }
        configured: { type: boolean, description: '是否已绑定可用 Dify 应用（租户专属绑定优先于共享绑定）' }
    KnowledgeBaseItem:
      type: object
      required: [id, name, visibility, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        visibility: { type: string, enum: [private, tenant], description: 'private 仅所有者可见、tenant 租户共享' }
        status: { type: string, enum: [provisioning, active], description: 'provisioning 本地已建待同步 Dify、active 上游数据集已就绪' }
        createdAt: { type: string, format: date-time }
    KnowledgeBaseCreateInput:
      type: object
      required: [name, visibility]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        visibility: { type: string, enum: [private, tenant] }
    KnowledgeDocument:
      type: object
      required: [id, name, contentType, sizeBytes, indexingStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: '原始文件名' }
        contentType: { type: string, description: '上传时的 MIME 类型，缺失时为 application/octet-stream' }
        sizeBytes: { type: integer, format: int64 }
        indexingStatus: { type: string, enum: [waiting, indexing], description: 'waiting 已落盘待上传/索引重试、indexing Dify 索引中（后续可能变为 completed/failed 等上游状态）' }
        createdAt: { type: string, format: date-time }
    RunCreateInput:
      type: object
      required: [agentVersionId, query]
      properties:
        agentVersionId: { type: string, format: uuid, description: '智能体版本 ID，须为已发布版本' }
        conversationId: { type: string, format: uuid, description: '已有会话 ID，须属于当前用户且状态为 active；为空时自动创建新会话' }
        query: { type: string, minLength: 1, maxLength: 20000, description: '用户输入文本' }
        inputs: { type: object, additionalProperties: true, description: '智能体参数（须符合版本 parameterSchema）' }
    Run:
      type: object
      required: [id, status, input, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid, description: '所属会话 ID' }
        status: { type: string, enum: [queued, dispatching, running, cancel_requested, succeeded, failed, stopped] }
        input: { type: object, additionalProperties: true, description: '请求快照，含 query 与 inputs' }
        output: { type: object, additionalProperties: true, description: '运行结果，终态后填充' }
        errorCode: { type: string, description: '失败时的错误码' }
        errorMessage: { type: string, description: '失败时的错误信息' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RunEvent:
      type: object
      required: [sequence, eventType, payload, createdAt]
      properties:
        sequence: { type: integer, format: int64, description: '事件序号，单调递增，同时作为 SSE 的 id 字段' }
        eventType: { type: string, description: '事件类型：run.queued、run.dispatch_deferred、run.started、run.delta、run.replace、run.agent_thought、run.workflow.*、run.billing_review、run.succeeded、run.failed、run.stopped' }
        payload: { type: object, additionalProperties: true, description: '事件负载，如 {delta}、{content}、{status, output}、{status, code, message}' }
        createdAt: { type: string, format: date-time }
    ToolTicketInput:
      type: object
      required: [toolCode]
      properties:
        toolCode: { type: string, minLength: 2, maxLength: 64, description: '工具编码，服务端转小写匹配' }
    ToolTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string, description: 'HMAC-SHA256 签名票据，调用 /api/v1/internal/tools/invoke 时置于 Authorization: Tool <ticket>' }
        expiresAt: { type: string, format: date-time, description: '过期时间（签发后 5 分钟）' }
    InvokeInput:
      type: object
      properties:
        arguments: { type: object, additionalProperties: true, description: '传给工具的业务参数；身份信息由票据携带，请求体不可指定' }
    Account:
      type: object
      required: [id, subjectType, currency, balance, frozenAmount, available, status]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [user, tenant], description: 'user 用户钱包（个人空间）、tenant 租户共享钱包（企业空间）' }
        currency: { type: string }
        balance: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: '余额，十进制字符串' }
        frozenAmount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: '运行预占冻结金额，十进制字符串' }
        available: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: '可用金额 = balance - frozenAmount' }
        status: { type: string, enum: [active] }
    Plan:
      type: object
      required: [id, code, name, audience, versionId, version, billingPeriod, price, currency, benefits]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: '套餐编码，如 free' }
        name: { type: string }
        audience: { type: string, enum: [all, personal, organization], description: '适用租户类型，all 通用' }
        versionId: { type: string, format: uuid, description: '当前生效的套餐版本 ID' }
        version: { type: integer }
        billingPeriod: { type: string, description: '计费周期，如 month' }
        price: { type: string, description: '价格，十进制字符串' }
        currency: { type: string }
        benefits: { type: object, additionalProperties: true, description: '权益配置，键为权益名、值为限额' }
    Entitlement:
      type: object
      required: [key, limit, used, reserved, periodEnd]
      properties:
        key: { type: string, description: '权益名' }
        limit: { type: string, description: '周期限额，十进制字符串' }
        used: { type: string, description: '已用量，十进制字符串' }
        reserved: { type: string, description: '预占量，十进制字符串' }
        periodEnd: { type: string, format: date-time }
    Subscription:
      type: object
      required: [id, planCode, planName, status, currentPeriodStart, currentPeriodEnd, cancelAtPeriodEnd, entitlements]
      properties:
        id: { type: string, format: uuid }
        planCode: { type: string }
        planName: { type: string }
        status: { type: string, enum: [trialing, active, past_due] }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        entitlements:
          type: array
          items: { $ref: '#/components/schemas/Entitlement' }
    LedgerEntry:
      type: object
      required: [id, entryType, amount, balanceAfter, frozenAfter, businessType, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        entryType: { type: string, enum: [grant, reserve, release, consume, adjust], description: 'grant 赠送、reserve 预占、release 释放、consume 消费、adjust 人工调账' }
        amount: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', description: '变动金额（可为负），十进制字符串' }
        balanceAfter: { type: string, description: '变动后余额' }
        frozenAfter: { type: string, description: '变动后冻结金额' }
        businessType: { type: string, enum: [signup_trial, ai_run, manual_adjustment], description: '业务类型：注册赠送、AI 运行、人工调账' }
        businessId: { type: string, format: uuid, description: '关联业务 ID（如运行 ID），可为空' }
        metadata: { type: object, additionalProperties: true, description: '附加信息（原因、Token 用量等）' }
        createdAt: { type: string, format: date-time }
    CostSummaryItem:
      type: object
      required: [costType, provider, model, amount, currency]
      properties:
        costType: { type: string, enum: [model_input, model_output], description: '成本类型：输入 Token、输出 Token' }
        provider: { type: string, description: '模型供应商编码' }
        model: { type: string, description: '模型名称' }
        amount: { type: string, description: '汇总成本金额，十进制字符串' }
        currency: { type: string }
    ReconciliationReport:
      type: object
      required: [succeededRunsMissingUsage, reservationsAwaitingUsage, reservationsInReview, usageMissingCost]
      properties:
        succeededRunsMissingUsage: { type: integer, format: int64, description: '已成功但缺少用量记录的运行数' }
        reservationsAwaitingUsage: { type: integer, format: int64, description: '等待用量回传的预占数' }
        reservationsInReview: { type: integer, format: int64, description: '待人工复核的预占数' }
        usageMissingCost: { type: integer, format: int64, description: '有用量但缺少成本记录的条数' }
    AdjustmentInput:
      type: object
      required: [amount, idempotencyKey, reason]
      properties:
        amount: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', description: '调账金额，十进制字符串，正为加款、负为扣款，不可为 0' }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128, description: '幂等键，记录在钱包流水中' }
        reason: { type: string, minLength: 2, maxLength: 255, description: '调账原因，写入流水 metadata' }
    DifyInstance:
      type: object
      required: [id, name, baseUrl, status, deploymentType, healthStatus, consecutiveFailures, credentialVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseUrl: { type: string, format: uri, description: 'Dify 服务地址（不含结尾斜杠）' }
        status: { type: string, enum: [active] }
        deploymentType: { type: string, enum: [shared, dedicated], description: 'shared 平台共享、dedicated 租户独享' }
        healthStatus: { type: string, enum: [unknown, healthy, degraded, unavailable] }
        lastHealthCheckAt: { type: string, format: date-time, description: '最近一次健康检查时间，未检查过则不返回' }
        consecutiveFailures: { type: integer, description: '连续失败次数' }
        credentialVersion: { type: integer, description: '凭据版本，每次轮换递增' }
        createdAt: { type: string, format: date-time }
    CreateDifyInstanceInput:
      type: object
      required: [name, baseUrl, apiKey]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        baseUrl: { type: string, format: uri, description: 'Dify 服务地址' }
        apiKey: { type: string, minLength: 8, description: 'Dify 管理 API Key，服务端加密保存' }
        deploymentType: { type: string, enum: [shared, dedicated], description: '缺省为 dedicated' }
    RotateCredentialInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 8, description: '新的 Dify API Key，服务端加密保存' }
    BindAppInput:
      type: object
      required: [agentVersionId, difyInstanceId, apiKey]
      properties:
        agentVersionId: { type: string, format: uuid, description: '智能体版本 ID' }
        difyInstanceId: { type: string, format: uuid, description: 'Dify 实例 ID，须租户可见（自有或共享）' }
        upstreamAppId: { type: string, description: '上游 Dify 应用 ID，可为空' }
        apiKey: { type: string, minLength: 8, description: '该应用的 Dify API Key，服务端加密保存' }
    CreateModelProvider:
      type: object
      required: [code, name, providerType, baseUrl]
      properties:
        code: { type: string, minLength: 2, maxLength: 64, description: '供应商编码，服务端转小写保存' }
        name: { type: string, minLength: 2, maxLength: 100 }
        providerType: { type: string, enum: [openai, anthropic, deepseek, ollama, vllm, compatible] }
        baseUrl: { type: string, format: uri }
        apiKey: { type: string, description: '供应商 API Key，可为空，非空时加密保存' }
        shared: { type: boolean, description: 'true 为平台共享供应商（不归属任何租户）' }
    ModelProvider:
      type: object
      required: [id, code, name, providerType, baseUrl, status, shared, healthStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        providerType: { type: string, enum: [openai, anthropic, deepseek, ollama, vllm, compatible] }
        baseUrl: { type: string, format: uri }
        status: { type: string, enum: [active] }
        shared: { type: boolean, description: '是否平台共享' }
        healthStatus: { type: string, enum: [unknown, healthy, degraded, unavailable] }
        lastHealthAt: { type: string, format: date-time, description: '最近一次健康检查时间，未检查过则不返回' }
        createdAt: { type: string, format: date-time }
    SetModelRouteInput:
      type: object
      required: [agentVersionId, providerId, model]
      properties:
        agentVersionId: { type: string, format: uuid }
        providerId: { type: string, format: uuid, description: '供应商 ID，须为当前租户可用的活跃供应商' }
        model: { type: string, minLength: 1, maxLength: 128, description: '模型名称' }
        priority: { type: integer, minimum: 1, maximum: 1000, default: 100, description: '路由优先级，值越小越优先' }
        config: { type: object, additionalProperties: true, description: '路由附加配置' }
    ModelPrice:
      type: object
      required: [model, inputPer1000, outputPer1000]
      properties:
        model: { type: string, minLength: 1, maxLength: 128 }
        inputPer1000: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: '每千输入 Token 成本，十进制字符串' }
        outputPer1000: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: '每千输出 Token 成本，十进制字符串' }
        currency: { type: string, maxLength: 16, default: CNY }
    CreateTool:
      type: object
      required: [code, name, protocol, endpoint]
      properties:
        code: { type: string, minLength: 2, maxLength: 64, description: '工具编码，服务端转小写保存' }
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string }
        protocol: { type: string, enum: [http_json, mcp_http], description: 'http_json 直接发送 arguments，mcp_http 以 JSON-RPC tools/call 封装' }
        endpoint: { type: string, format: uri, description: '工具端点；生产环境必须 HTTPS 且禁止内网/回环/链路本地地址' }
        method: { type: string, enum: [GET, POST, PUT, PATCH], default: POST }
        credential: { type: string, description: '调用凭据（以 Bearer 头转发），服务端加密保存，不通过接口返回' }
        inputSchema: { type: object, additionalProperties: true, description: '入参 JSON Schema' }
        outputSchema: { type: object, additionalProperties: true, description: '出参 JSON Schema' }
        timeoutMs: { type: integer, minimum: 100, maximum: 120000, default: 10000, description: '调用超时（毫秒）' }
        maxResponseBytes: { type: integer, minimum: 1024, maximum: 10485760, default: 1048576, description: '响应体大小上限（字节）' }
    Tool:
      type: object
      required: [id, code, name, description, protocol, status, version, endpoint, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [http_json, mcp_http] }
        status: { type: string, enum: [active] }
        version: { type: integer, description: '最新有效版本号' }
        endpoint: { type: string, format: uri, description: '最新有效版本的端点' }
        createdAt: { type: string, format: date-time }
    GrantInput:
      type: object
      required: [tenantId]
      properties:
        tenantId: { type: string, format: uuid, description: '被授权租户 ID' }
        allowedAgentVersionIds:
          type: array
          items: { type: string, format: uuid }
          description: '允许调用的智能体版本白名单，为空表示不限制'
        maxCallsPerRun: { type: integer, minimum: 1, maximum: 1000, default: 10, description: '单次运行调用上限，失败调用也计入' }
    ExportResult:
      type: object
      required: [exportId, checksumSha256, manifest, exportedAt]
      properties:
        exportId: { type: string, format: uuid, description: '导出审计记录 ID' }
        checksumSha256: { type: string, description: 'manifest 的 SHA-256 校验和' }
        manifest:
          type: object
          additionalProperties: true
          description: '迁移清单，含 formatVersion、tenantId、tenant、members、agentConfigs、knowledgeBases、files、documents、conversations、messages、runs、usage、walletLedger、exportedAt，不含任何凭据'
        exportedAt: { type: string, format: date-time }
  responses:
    Success:
      description: Successful envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unauthorized:
      description: '未认证或令牌不可用。code=14010 缺少访问令牌；14011 令牌无效或已过期；14013 用户或租户成员关系已失效'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    IdentityUnavailable:
      description: '身份校验依赖（数据库）不可用。code=15012'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    PlatformAdminOnly:
      description: '需要安装级平台管理员权限。code=14030'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
