          application/json:
            schema: { $ref: '#/components/schemas/ToolTicketInput' }
      responses:
        '200':
          description: '签发成功，code=0，data.ticket 为签名票据，data.expiresAt 为过期时间'
          content:
            application/json:
              schema:
                allOf:
