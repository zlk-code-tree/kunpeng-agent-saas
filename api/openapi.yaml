  /api/v1/runs/{id}/events:
    get:
      tags: [运行]
      summary: 以 SSE 流式订阅运行事件
      description: |
        返回 text/event-stream 事件流，每帧格式为 id: <事件序号>、event: <事件类型>、data: <RunEvent JSON>。
        事件按序号递增推送，支持断线续传：重连时携带请求头 Last-Event-ID（值为最后收到的事件序号），
        服务端只推送序号在其之后的事件。事件类型包括 run.queued、run.dispatch_deferred、run.started、
        run.delta（增量文本）、run.replace（全量替换文本）、run.agent_thought、run.workflow.*（工作流节点）、
        run.billing_review（结算异常待复核）、run.succeeded、run.failed、run.stopped。
        run.succeeded/run.failed/run.stopped 为终态事件，推送后服务端关闭连接。
        服务端每 500ms 轮询共享数据库，因此任意 API 副本都能推送任意 Worker 产生的事件。
        运行不存在或不可见时连接直接结束（不返回错误体）。
        错误：500 code=15403 当前环境不支持流式输出。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Last-Event-ID
          in: header
          description: '断线续传起点，值为上次收到的事件序号（整数），不传则从第一条事件开始'
          required: false
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: 'SSE 事件流，持续推送直到终态事件或客户端断开'
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                frame:
                  summary: '单帧事件示例'
                  value: "id: 2\nevent: run.delta\ndata: {\"sequence\":2,\"eventType\":\"run.delta\",\"payload\":{\"delta\":\"你好\"},\"createdAt\":\"2026-10-28T08:00:00Z\"}\n\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15403 流式输出不可用'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
