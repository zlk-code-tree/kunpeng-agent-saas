openapi: 3.1.0
info:
  title: Gin Dify SaaS API
  version: 1.0.0
  description: |
    Gin Dify SaaS 平台全部后端接口契约：安装初始化、认证与用户、租户与成员、智能体目录、
    知识库、运行编排（含 SSE 事件流）、计费与对账、Dify/模型供应商集成、工具网关和运维导出。

    统一响应封装：所有接口（/metrics 除外）返回 {code, message, data}。成功时 code=0、message=ok，
    查询/操作类接口为 HTTP 200，创建类接口为 HTTP 201，业务数据放在 data 中。错误响应同样为封装体
    （无 data 字段），code 为业务错误码：14xxx 表示客户端错误，15xxx 表示服务端错误，
    message 为人类可读的错误说明。

    认证方式：
    - 登录用户接口：Authorization: Bearer <JWT>（登录、注册、切换租户获取）。
    - 平台管理接口：Bearer JWT 且用户带安装级 platform_admin 标记，权限高于租户 owner/admin。
    - 工具调用接口 /api/v1/internal/tools/invoke：Authorization: Tool <HMAC 票据>，非 Bearer JWT，
      票据由 /api/v1/runs/{id}/tool-tickets 签发，5 分钟有效且绑定具体运行身份。

    公共请求头（按需）：Authorization（鉴权）、Idempotency-Key（POST /api/v1/runs 幂等键）、
    Last-Event-ID（SSE 断线续传，值为事件序号）、X-Request-ID（全链路追踪，服务端在响应头回传）。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: 系统探针
    description: 无鉴权的进程健康与指标探针
  - name: 安装
    description: 平台一次性安装与能力查询
  - name: 认证与用户
    description: 登录、注册、令牌与当前用户信息
  - name: 租户与成员
    description: 租户空间、成员、邀请与所有权管理
  - name: 智能体
    description: 预置智能体目录
  - name: 知识库
    description: 知识库与文档管理
  - name: 运行
    description: 智能体运行创建、查询、取消与事件流
  - name: 计费
    description: 钱包、套餐、订阅、流水与成本
  - name: 平台集成
    description: Dify 实例、模型供应商与模型路由（平台管理员）
  - name: 工具网关
    description: 受控工具目录、授权、票据与调用
  - name: 运维
    description: 租户数据导出等运维操作（平台管理员）
paths:
  /healthz:
    get:
      tags: [系统探针]
      summary: 存活探针，确认 HTTP 进程仍在运行
      description: '进程级存活检查，不探测数据库、Redis 等外部依赖，供容器编排的 liveness 探针使用。无需鉴权。成功时 data.status 固定为 ok。'
      security: []
      responses:
        '200':
          description: '进程存活，code=0'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/StatusMessage' } } }
  /readyz:
    get:
      tags: [系统探针]
      summary: 就绪探针，确认数据库与 Redis 依赖均可用
      description: '以 2 秒超时 Ping 数据库和 Redis，核心依赖全部可用才返回就绪，供容器编排的 readiness 探针使用。无需鉴权。成功时 data.status 固定为 ready。错误：503 code=15020 数据库未就绪；15021 Redis 未就绪。'
      security: []
      responses:
        '200':
          description: '依赖就绪，code=0'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/StatusMessage' } } }
        '503':
          description: '核心依赖不可用。code=15020 数据库未就绪；15021 Redis 未就绪'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /metrics:
    get:
      tags: [系统探针]
      summary: 以 Prometheus 文本格式暴露当前进程采集的运行指标
      description: '返回当前进程采集的 HTTP 请求量、在途请求、延迟等 Prometheus 指标（text/plain 原始文本，非统一响应封装）。指标只属于当前进程，多副本部署需逐实例抓取后聚合。无需鉴权。'
      security: []
      responses:
        '200':
          description: 'Prometheus 文本格式指标'
          content:
            text/plain:
              schema: { type: string }
  /api/v1/install/status:
    get:
      tags: [安装]
      summary: 查询平台安装状态与当前运行模式
      description: '返回平台是否已完成首次安装、单/多租户模式（single 或 multi）以及安装 ID、默认租户 ID（未安装时二者不返回）。公开接口，无需鉴权。错误：500 code=15001 加载安装状态失败，或运行配置模式与数据库已安装模式不一致。'
      security: []
      responses:
        '200':
          description: '安装状态查询成功，code=0'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/InstallationStatus' } } }
        '500':
          description: 'code=15001 加载安装状态失败或运行模式与已安装模式不一致'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/install:
    post:
      tags: [安装]
      summary: 执行一次性平台初始化，创建默认租户、平台管理员、计费账户与预置智能体
      description: '整个平台只允许执行一次，成功后返回安装状态。初始化在单个事务内原子创建默认租户、平台管理员（owner）、成员关系、计费账户（含期初赠送流水与免费订阅）和预置智能体。公开接口，无需鉴权，应在任何用户注册前调用。错误：400 code=14001 参数校验失败；409 code=14009 平台已安装；500 code=15002 初始化失败。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupInput' }
      responses:
        '201':
          description: '初始化成功，code=0，data 为安装状态'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/InstallationStatus' } } }
        '400':
          description: 'code=14001 请求参数缺失或不满足长度约束'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 'code=14009 平台已安装，不允许重复初始化'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15002 初始化失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/system/capabilities:
    get:
      tags: [安装]
      summary: 查询平台能力开关，供前端决定开放哪些功能
      description: '根据安装模式返回 features 布尔开关：tenantCreation、tenantSwitching（仅多租户模式为 true）、billing、payment、enterpriseDify、modelRouting、toolGateway、providerCosting、tenantExport。公开接口，无需鉴权。错误：500 code=15001 加载能力配置失败。'
      security: []
      responses:
        '200':
          description: '能力查询成功，code=0'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/Capabilities' } } }
        '500':
          description: 'code=15001 加载能力配置失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/auth/login:
    post:
      tags: [认证与用户]
      summary: 使用用户名密码登录并签发访问令牌
      description: '校验用户名和密码后签发 JWT（accessToken），后续请求以 Authorization: Bearer <accessToken> 调用受保护接口。多租户用户首次登录优先绑定默认租户，否则绑定最早加入的租户；切换租户会重新签发令牌。公开接口，无需鉴权。错误：400 code=14001 缺少用户名或密码；401 code=14012 用户名或密码错误；500 code=15010 登录失败。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: '登录成功，code=0，data 为访问令牌'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/LoginResult' } } }
        '400':
          description: 'code=14001 缺少用户名或密码'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401':
          description: 'code=14012 用户名或密码错误'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15010 登录失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/auth/register:
    post:
      tags: [认证与用户]
      summary: 注册新用户并自动创建个人空间、成员关系与计费账户
      description: '仅在多租户（multi）模式开放注册。注册在单个事务内原子创建用户、个人空间租户、owner 成员关系和计费账户，成功后直接返回可用令牌与新租户 ID。用户名会转小写并去除首尾空白。公开接口，无需鉴权。错误：400 code=14600 参数校验失败；409 code=14609 当前部署为单租户模式不允许注册；409 code=14610 用户名已存在；500 code=15600 注册失败。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: '注册成功，code=0，data 为访问令牌与新租户 ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/RegisterResult' } } }
        '400':
          description: 'code=14600 注册参数缺失或不满足长度约束'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 'code=14609 单租户模式不允许注册；14610 用户名已存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 注册失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/internal/tools/invoke:
    post:
      tags: [工具网关]
      summary: 持运行绑定的签名票据调用受控工具（HTTP 或 MCP）
      description: |
        智能体运行时专用接口，不使用普通用户 JWT。鉴权头格式为 Authorization: Tool <ticket>，
        其中 ticket 是由 /api/v1/runs/{id}/tool-tickets 签发的 HMAC-SHA256 签名票据，5 分钟有效。
        租户、用户、运行和工具身份全部取自签名票据，请求体只能携带业务参数，无法把调用切换到其他租户或其他运行。
        网关在真正调用前会依据数据库实时复核：运行状态（dispatching/running）、租户工具授权、智能体版本白名单、
        单次运行调用上限（失败调用也计入）、端点安全策略（生产环境要求 HTTPS 且禁止内网/回环/链路本地地址），
        并对每次调用落审计记录。mcp_http 协议以 JSON-RPC tools/call 封装请求，http_json 直接发送 arguments。
        错误：401 code=14805 缺少票据或请求体非法；403 code=14804 票据无效/过期、运行状态不允许、
        未获授权或已超出单次运行调用上限；502 code=15802 上游工具调用失败（网络错误、超时、非 2xx 或响应体超限）。
      security:
        - toolTicket: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvokeInput' }
      responses:
        '200':
          description: '调用成功，code=0，data 为工具返回的 JSON 对象（非 JSON 响应包装为 {content: 原始文本}）'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: object, additionalProperties: true } } }
        '401':
          description: 'code=14805 缺少 Tool 票据或请求体不是合法 JSON'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403':
          description: 'code=14804 票据无效或已过期、运行状态不允许、租户/智能体未获授权或超出调用上限'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '502':
          description: 'code=15802 上游工具调用失败（网络错误、超时、非 2xx 响应或响应体超过 maxResponseBytes）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/auth/logout:
    post:
      tags: [认证与用户]
      summary: 退出登录
      description: '当前为无状态 JWT，服务端不做令牌吊销，退出成功后由客户端删除本地令牌。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '退出成功，code=0，data.success 恒为 true'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/SuccessFlag' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/auth/codes:
    get:
      tags: [认证与用户]
      summary: 获取当前用户的前端权限码列表
      description: '返回控制界面访问所需的权限码：所有用户包含 agent:use、knowledge:manage，安装级平台管理员额外包含 platform:manage。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为权限码字符串数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/user/info:
    get:
      tags: [认证与用户]
      summary: 获取当前登录用户的资料与实时角色
      description: '返回前端所需的用户资料和角色列表。角色以中间件实时校验的当前租户成员角色为准（首位），平台管理员标记追加在后，租户内权限规则不因此改变。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为当前用户资料'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/UserInfo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15011 加载用户资料失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/agents:
    get:
      tags: [智能体]
      summary: 列出当前租户可用的预置智能体及最新已发布版本
      description: '智能体模板全局共享，启用状态和 Dify 绑定按租户隔离。configured 表示该版本已绑定可用的 Dify 应用（租户专属绑定优先于共享兜底绑定，与执行 Worker 的路由规则一致），enabled 反映租户级启用开关。parameterSchema 为该版本的参数 JSON Schema。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为智能体数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/AgentItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15100 加载智能体列表失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/billing/account:
    get:
      tags: [计费]
      summary: 查询当前计费主体的钱包余额
      description: '按当前租户类型解析实际承担费用的计费账户：个人空间返回创建者的用户钱包，企业空间返回租户共享钱包。金额字段均为十进制字符串，available = balance - frozenAmount。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为计费账户'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/Account' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 'code=14704 计费账户不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15700 加载计费账户失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/billing/plans:
    get:
      tags: [计费]
      summary: 列出当前租户可购买或使用的套餐版本
      description: '返回适用于当前租户类型（personal 或 organization，audience=all 通用）且当前生效的最新套餐版本，按价格升序。benefits 为该版本的权益配置。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为套餐数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/Plan' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15701 加载套餐失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/billing/subscription:
    get:
      tags: [计费]
      summary: 查询当前有效订阅及本周期权益使用情况
      description: '返回当前计费主体最近一条有效订阅（trialing/active/past_due）及其权益计数器：limit 为周期限额，used 为已用量，reserved 为运行预占量，periodEnd 为周期结束时间。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为订阅及权益'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/Subscription' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 'code=14704 无有效订阅'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15703 加载订阅失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/billing/ledger:
    get:
      tags: [计费]
      summary: 分页查询当前计费主体的钱包流水
      description: '按时间倒序返回钱包流水（期初赠送、预占、释放、消费、人工调账），流水是余额变更的审计依据，不可修改。'
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: '返回条数，默认 50，有效范围 1-100，超出范围回落为 50'
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: '查询成功，code=0，data 为流水数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15704 加载钱包流水失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants:
    get:
      tags: [租户与成员]
      summary: 列出当前用户加入的全部有效租户
      description: '返回用户所有活跃成员关系对应的租户，个人空间排在前面。current=true 标记当前令牌所选择的租户。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为租户数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/TenantItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15600 加载租户列表失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
    post:
      tags: [租户与成员]
      summary: 创建新的企业租户空间
      description: '仅多租户（multi）模式可用。创建企业空间并把创建者设为 owner，同时创建归属租户的企业共享计费账户（成员共享额度），写入 tenant.create 审计。'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreateInput' }
      responses:
        '201':
          description: '创建成功，code=0，data 为新租户'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/TenantItem' } } }
        '400':
          description: 'code=14601 租户名称缺失或不满足长度约束'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 'code=14609 单租户模式不允许创建租户'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 创建租户失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants/{id}/switch:
    post:
      tags: [租户与成员]
      summary: 切换当前租户并换发绑定目标租户的新访问令牌
      description: '旧令牌不能直接授权其他租户；切换时重新校验用户、租户和成员关系后签发新令牌，后续请求须使用新令牌。目标租户须为活跃状态且用户为其活跃成员。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: '切换成功，code=0，data 为新令牌与目标租户'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/SwitchResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 'code=14604 目标租户不存在、已停用或当前用户不是其活跃成员'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 切换租户失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants/{id}/members:
    get:
      tags: [租户与成员]
      summary: 列出指定租户的活跃成员
      description: '按角色优先级（owner、admin、finance、member）返回成员列表。只能查询当前令牌已切换到的租户。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: '查询成功，code=0，data 为成员数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/TenantMember' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code=14603 路径租户与当前令牌租户不一致，需先切换到该租户'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 加载成员列表失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants/{id}/invitations:
    post:
      tags: [租户与成员]
      summary: 为已注册用户创建限时租户邀请
      description: '仅当前租户的 owner 或 admin 可邀请，且必须先切换到该租户。目标用户须已注册且尚未加入本租户；邀请 72 小时有效。原始邀请令牌只在本次响应返回一次，数据库仅保存 SHA-256 摘要，需通过可信渠道转交被邀请人。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteInput' }
      responses:
        '201':
          description: '邀请创建成功，code=0，data 含仅此一次返回的邀请令牌'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/Invitation' } } }
        '400':
          description: 'code=14604 邀请参数非法（用户名长度或 role 不在 admin/member/finance 之内）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code=14603 非当前租户或当前用户不是 owner/admin'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 'code=14604 目标用户名不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 'code=14610 目标用户已是本租户成员或存在冲突的待处理邀请'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 创建邀请失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenant-invitations/accept:
    post:
      tags: [租户与成员]
      summary: 接受属于当前用户的有效邀请并加入租户
      description: '原子消费邀请并创建或恢复成员关系（支持重新邀请已退出用户），邀请只能被消费一次。并发重复提交由行锁保护。'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationInput' }
      responses:
        '200':
          description: '接受成功，code=0，data 为加入的租户'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/TenantItem' } } }
        '400':
          description: 'code=14606 邀请令牌缺失或长度不在 32-256 之间'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 'code=14604 邀请不存在、已被消费或已过期'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 接受邀请失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants/{id}/members/{userId}:
    delete:
      tags: [租户与成员]
      summary: 按角色权限移除指定租户成员
      description: '仅当前租户的 owner 或 admin 可操作，且必须先切换到该租户。规则：不能移除自己；不能移除 owner（须先转移所有权）；admin 不能移除同级 admin。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: userId
          in: path
          description: '目标成员的用户 ID'
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: '移除成功，code=0，data.success 恒为 true'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/SuccessFlag' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code=14603 无权限（非 owner/admin、移除自己、移除 owner 或 admin 互删）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 'code=14604 目标用户不是本租户活跃成员'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 移除成员失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants/{id}/leave:
    post:
      tags: [租户与成员]
      summary: 当前用户退出指定租户
      description: '普通成员可自行退出；owner 必须先完成所有权转移才能退出（防止租户无所有者）。仅能退出当前令牌所在的租户。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: '退出成功，code=0，data.success 恒为 true'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/SuccessFlag' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code=14603 路径租户与当前令牌租户不一致，或所有者未先转移所有权'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 'code=14604 当前用户不是该租户活跃成员'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 退出租户失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/tenants/{id}/transfer-ownership:
    post:
      tags: [租户与成员]
      summary: 将租户所有权转移给指定成员
      description: '仅当前租户的 owner 可操作，且必须先切换到该租户。原所有者降级为 admin、目标成员升级为 owner 在同一事务内原子完成，不产生双所有者或无所有者的中间状态。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipInput' }
      responses:
        '200':
          description: '转移成功，code=0，data.success 恒为 true'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/SuccessFlag' } } }
        '400':
          description: 'code=14605 userId 缺失或不是合法 UUID'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'code=14603 当前用户不是该租户 owner 或未切换到该租户'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 'code=14604 目标用户不是本租户活跃成员'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 'code=14610 转移给自己或目标成员已是 owner'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15600 转移所有权失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/knowledge-bases:
    get:
      tags: [知识库]
      summary: 列出当前用户可见的知识库
      description: '返回当前租户的共享知识库（visibility=tenant）和当前用户拥有的私有知识库（visibility=private），按创建时间倒序。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '查询成功，code=0，data 为知识库数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/KnowledgeBaseItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15200 加载知识库列表失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
    post:
      tags: [知识库]
      summary: 创建私有或租户共享知识库
      description: '先在本地创建知识库记录（初始状态 provisioning），再尽力在租户自有或平台共享的 Dify 实例上创建同名数据集；成功后状态变为 active。Dify 实例缺失或临时不可用时本地知识库保留 provisioning 状态，不因外部集成故障丢失本地数据。'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeBaseCreateInput' }
      responses:
        '201':
          description: '创建成功，code=0，data 为知识库（status 为 provisioning 或 active）'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/KnowledgeBaseItem' } } }
        '400':
          description: 'code=14201 参数非法（name 长度 2-100，visibility 只能是 private 或 tenant）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15201 创建知识库失败'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/knowledge-bases/{id}/documents:
    get:
      tags: [知识库]
      summary: 列出指定知识库的文档及索引状态
      description: '按创建时间倒序返回文档。indexingStatus 反映 Dify 侧索引进度：waiting（待重试上传/索引）、indexing（索引中）以及后续完成状态。仅可见（私有且归属自己，或租户共享）的知识库可查询。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: '查询成功，code=0，data 为文档数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { type: array, items: { $ref: '#/components/schemas/KnowledgeDocument' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15212 加载文档列表失败（知识库不存在或当前用户不可见时同样返回此错误）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
    post:
      tags: [知识库]
      summary: 上传文档到指定知识库
      description: 'multipart/form-data 上传单个文件（字段名 file，不超过 50MB）。文件先落入本地对象存储（对象键带租户和知识库前缀，物理隔离）并计算 SHA-256 摘要，再尽力转发给 Dify 建立索引；Dify 上传失败时文档保持 waiting 等待重试，不拒绝已落盘的文件。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: '上传的文件内容，字段名必须为 file，单文件最大 50MB'
      responses:
        '201':
          description: '上传成功，code=0，data 为文档元数据'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/KnowledgeDocument' } } }
        '400':
          description: 'code=14210 缺少 file 字段或文件超过 50MB；14211 无法读取上传内容'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: 'code=15210 计算文件摘要失败；15211 上传失败（含知识库不存在或不可见）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/runs:
    post:
      tags: [运行]
      summary: 创建一次异步智能体运行
      description: '在单个事务内原子创建会话消息、运行记录、额度预占、初始事件（run.queued）和 Outbox 事件，返回 status=queued 的运行。conversationId 为空时自动创建新会话（标题取自 query 前 80 字），否则必须属于当前用户且状态为 active。支持幂等：携带相同 Idempotency-Key 重试返回首次创建的运行，不会重复冻结额度。'
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: '幂等键，按租户和用户隔离；不传时服务端生成随机键'
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCreateInput' }
      responses:
        '201':
          description: '运行创建成功，code=0，data 为运行记录'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { properties: { data: { $ref: '#/components/schemas/Run' } } }
        '400':
          description: 'code=14400 参数校验失败（agentVersionId 非 UUID、query 缺失或超过 20000 字符）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: 'code=14402 额度预占失败，钱包可用余额不足'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 'code=14403 当前计费主体不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 'code=15400 创建运行失败（含智能体版本不可用、会话不可用）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /api/v1/runs/{id}:
    get:
      tags: [运行]
      summary: 查询一次运行的详情
      description: '按租户和用户隔离读取运行记录，包含输入、输出（终态后填充）、错误码和错误信息。'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
